name: Release

# Push a tag like v0.2.0 to build and publish a release with a Linux binary.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: seeker
  # Link against an old glibc so the binary runs on Ubuntu 20.04+ / Debian 11+ /
  # Zorin 16+ and most other distros from the last few years.
  GLIBC: "2.31"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zig + cargo-zigbuild
        run: |
          pip3 install --user ziglang
          cargo install --locked cargo-zigbuild
      - name: Test
        run: cargo test
      - name: Build
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.${GLIBC}
      - name: Package
        run: |
          set -eu
          VER="${GITHUB_REF_NAME}"
          DIR="${APP}-${VER}-x86_64-linux"
          mkdir -p "dist/$DIR"
          cp "target/x86_64-unknown-linux-gnu/release/$APP" "dist/$DIR/"
          cp "assets/$APP.desktop" "assets/$APP.svg" install.sh README.md LICENSE THIRD-PARTY.md "dist/$DIR/"
          tar -C dist -czf "dist/$DIR.tar.gz" "$DIR"
          (cd dist && sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release-build
          path: dist/*.tar.gz
