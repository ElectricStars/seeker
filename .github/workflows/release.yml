name: Release

# Push a tag like v0.2.0 to build and publish a release with a Linux binary
# tarball and a .deb. Running it by hand with a tag (Actions > Release > Run
# workflow) rebuilds from the selected branch and adds the .deb to that
# existing release; the branch's Cargo.toml version must match the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the .deb to (e.g. v0.1.1); leave empty for a test build"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP: seeker
  APP_ID: io.github.ElectricStars.Seeker
  # Link against an old glibc so the binary runs on Ubuntu 20.04+ / Debian 11+ /
  # Zorin 16+ and most other distros from the last few years.
  GLIBC: "2.31"

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install zig, cargo-zigbuild and cargo-deb
        run: |
          pip3 install --user ziglang
          cargo install --locked cargo-zigbuild cargo-deb
      - name: Work out the version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${INPUT_TAG}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          CRATE_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CRATE_VER=$CRATE_VER" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ -n "$INPUT_TAG" ]; then
            [ "v$CRATE_VER" = "$TAG" ] || { echo "Cargo.toml version $CRATE_VER does not match $TAG"; exit 1; }
          fi
      - name: Test
        run: cargo test
      - name: Build
        run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.${GLIBC}
      - name: Package
        run: |
          set -eu
          DIR="${APP}-${TAG}-x86_64-linux"
          mkdir -p "dist/$DIR"
          cp "target/x86_64-unknown-linux-gnu/release/$APP" "dist/$DIR/"
          cp "data/$APP_ID.desktop" "data/$APP_ID.svg" "data/$APP_ID.metainfo.xml" install.sh README.md LICENSE THIRD-PARTY.md "dist/$DIR/"
          tar -C dist -czf "dist/$DIR.tar.gz" "$DIR"
          (cd dist && sha256sum "$DIR.tar.gz" > "$DIR.tar.gz.sha256")
      - name: Build .deb
        run: |
          set -eu
          # Uses the zigbuild binary above (glibc 2.31), so it installs on Ubuntu 20.04+.
          cargo deb --no-build --target x86_64-unknown-linux-gnu -o dist/
          DEB="${APP}_${CRATE_VER}_amd64.deb"
          test -f "dist/$DEB"
          (cd dist && sha256sum "$DEB" > "$DEB.sha256")
          dpkg-deb --info "dist/$DEB"
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256
          generate_release_notes: true
      - uses: softprops/action-gh-release@v2
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag != '' }}
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/*.deb
            dist/*.deb.sha256
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: release-build
          path: |
            dist/*.tar.gz
            dist/*.deb
