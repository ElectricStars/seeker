name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Monthly rebuild with the latest stable Rust so breakage shows up early.
    - cron: "0 6 1 * *"

env:
  CARGO_TERM_COLOR: always
  APP: seeker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Release build
        run: cargo build --release
      - name: Smoke test CLI
        run: ./target/release/${{ env.APP }} --cli -n "*.rs" -t "fn main" src
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-x86_64-linux-ci
          path: target/release/${{ env.APP }}
          retention-days: 14

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Validate desktop file
        run: desktop-file-validate data/io.github.ElectricStars.Seeker.desktop
      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net --explain data/io.github.ElectricStars.Seeker.metainfo.xml
